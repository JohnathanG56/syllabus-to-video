[project]
name = "syllabus-to-video"
version = "0.1.0"
description = "Upload a syllabus, get short narrated Manim lessons per topic. LLM-written animation code is rendered in a sandbox with a self-repair loop."
requires-python = ">=3.11"
authors = [{ name = "Johnathan Gossaye" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "docker: needs a running Docker daemon and the sandbox image (auto-skipped otherwise)",
    "manim: needs Manim importable on the host (auto-skipped otherwise)",
    "piper: needs a Piper voice + engine (auto-skipped otherwise)",
    "ffmpeg: needs ffmpeg + ffprobe on PATH (auto-skipped otherwise)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning",
]
